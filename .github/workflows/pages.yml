name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/screenshots/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Test, capture screenshots and build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: web
    env:
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Thai fonts for screenshots
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-core
      - name: Test model and build production site
        run: |
          npm test
          npm run build
      - name: Browser acceptance tests and screenshots
        run: npm run test:browser
      - name: Update README screenshots
        working-directory: .
        run: |
          node scripts/update-screenshots.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/screenshots
          if ! git diff --cached --quiet; then
            git commit -m 'docs: update live browser screenshots [skip ci]'
            git push origin HEAD:main
          fi
      - name: Preserve browser test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: web/artifacts/
          if-no-files-found: ignore
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    name: Publish public site
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
